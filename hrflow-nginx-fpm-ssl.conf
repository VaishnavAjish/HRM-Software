# ==============================================================================
# HRMS CAREER PORTAL - PRODUCTION NGINX + PHP-FPM CONFIGURATION (HTTPS)
# ==============================================================================

# HTTP Server: Automatic 301 Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name niss.pro www.niss.pro;

    # Suppress Server Version
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: High-Performance SSL & FastCGI PHP-FPM Setup
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name niss.pro www.niss.pro;

    # Suppress Nginx Version
    server_tokens off;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/niss.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niss.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # High-Performance Gzip Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Defense-in-Depth Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static Images, Logos & Media Files (Direct File Serve - Bypasses PHP completely)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2|woff|ttf|eot)$ {
        root /var/www/hrflow;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Long-Lived Cache Policy for Hashed Production Bundles (/assets/*)
    location /assets/ {
        root /var/www/hrflow;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # Frontend Single Page App (SPA) Routing
    location / {
        root /var/www/hrflow;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ /index.html;
    }

    # Direct FastCGI PHP-FPM Pass for Laravel Backend API
    location /api {
        root /home/ubuntu/salary-slip-bac/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Execute PHP Scripts via PHP-FPM Unix Socket
    location ~ \.php$ {
        root /home/ubuntu/salary-slip-bac/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # PHP-FPM Unix Socket Pool
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /home/ubuntu/salary-slip-bac/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # FastCGI Concurrency Buffers & Timeouts
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # Deny direct access to sensitive hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
