pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    includeBuild(new File(settingsDir, "../node_modules/@react-native/gradle-plugin/react-native-gradle-plugin"))
}

class ReactSettingsPlugin implements Plugin<Settings> {
    void apply(Settings settings) {}
}
apply plugin: ReactSettingsPlugin

rootProject.name = 'NISS Enterprise HRMS Mobile'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(file("../node_modules/react-native/gradle/libs.versions.toml")))
    }
  }
}

apply from: file("../node_modules/expo/scripts/autolinking.gradle")
useExpoModules()

apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesSettingsGradle(settings)

include ':app'
