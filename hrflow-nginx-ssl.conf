# HTTP Server: Automatic 301 Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name niss.pro www.niss.pro;

    # Suppress Server Version
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: SSL Certificate & Security Proxy Settings
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name niss.pro www.niss.pro;

    # Suppress Nginx Version in Server Header (Fixes Information Disclosure)
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/niss.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niss.pro/privkey.pem;

    # High-Performance Gzip Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Defense-in-Depth Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;

    # Static Images, Logos & Media Files (CORS Enabled for Local Dev & Cross-Origin)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2|woff|ttf|eot)$ {
        root /var/www/hrflow;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        try_files $uri =404;
    }

    # Long-Lived Cache Policy for Hashed Static Assets
    location /assets/ {
        root /var/www/hrflow;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # Never cache index.html, sw.js, or manifest.webmanifest so updates load immediately on normal refresh
    location ~* (index\.html|sw\.js|manifest\.webmanifest)$ {
        root /var/www/hrflow;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Serve Frontend Web Root
    location / {
        root /var/www/hrflow;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ /index.html;
    }

    # Laravel API — served directly by PHP-FPM (was: proxy_pass to `php artisan serve`,
    # a single-threaded dev server that could not handle concurrent load and crashed
    # under a 10K-login spike on 2026-08-17)
    location /api/ {
        # Preflight OPTIONS Handling
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Company-Code,X-Unit' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        root /home/ubuntu/salary-slip-bac/public;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /home/ubuntu/salary-slip-bac/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }
}
