# ==============================================================================
# HRMS CAREER PORTAL - PRODUCTION PHP-FPM POOL CONFIGURATION (/etc/php/8.3/fpm/pool.d/www.conf)
# ==============================================================================
#
# WORKER CAPACITY CALCULATIONS:
# -----------------------------
# System RAM          : 16 GB (16,384 MB)
# Reserved OS/DB/Redis: 4 GB (4,096 MB)
# Available PHP Memory: 12 GB (12,288 MB)
# Avg PHP Worker Memory: 40 MB
# Max Children Formula : 12,288 MB / 40 MB = 307 workers
# Target Max Children  : 300 workers
# Single Worker Bcrypt : 5.67 logins/sec
# Total Pool Throughput: 300 * 5.67 = 1,701 logins/sec (102,060 logins/minute)
#
# ==============================================================================

[www]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 300
pm.start_servers = 32
pm.min_spare_servers = 16
pm.max_spare_servers = 64
pm.max_requests = 1000

# Timeout Limits to Prevent Stale Worker Locks
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/www-slow.log

# Environment & Limits
rlimit_files = 65536
rlimit_core = 0

catch_workers_output = yes
decorate_workers_output = no
